[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tagphy"
version = "0.1.0"
description = "Portable USB photo cataloger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.0",
  "google-adk[db]>=1.0.0",
  "greenlet",
  "pillow~=12.3.0",
  "pillow-heif~=1.5.0",
  "reverse_geocoder",
  "google-genai",
  "numpy",
  "onnxruntime",
  "tokenizers",
]

[project.scripts]
tagphy = "tagphy.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tagphy = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
