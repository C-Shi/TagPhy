[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tagphy"
version = "0.1.0"
description = "Portable USB photo cataloger (learning project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.0",
  "google-adk>=1.0.0",
]

[project.scripts]
tagphy = "tagphy.main:main"

[tool.setuptools.packages.find]
where = ["src"]
